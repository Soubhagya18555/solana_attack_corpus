id: durable_nonce_replay
title: Durable Nonce Transaction Replay and Ordering Abuse
severity: high
tactic: defense_evasion
technique: nonce_replay
first_observed: 2022-06
chain: solana
affected_programs:
  - program_id: 11111111111111111111111111111111
    role: system_program
    name: System Program
    notes: AdvanceNonceAccount and CreateNonceAccount instructions manage durable nonce lifecycle.
  - program_id: Nonce111111111111111111111111111111111111111
    role: dependency
    name: Recent Blockhashes / Nonce Sysvar
    notes: Nonce value replaces recent blockhash in partially signed flows.
prerequisites:
  - Protocol or wallet uses durable nonce accounts for offline or multisig signing workflows.
  - Partially signed transaction held by counterparty or leaked from mempool cache.
  - Nonce authority not rotated after suspected compromise.
  - Missing instruction to advance nonce after intended one-time use.
attack_surface:
  - off_chain_signature
  - account_validation
  - instruction_handler
indicators:
  on_chain:
    - Same transaction signature attempted multiple times until nonce advances.
    - AdvanceNonceAccount missing as first instruction in durable nonce transaction.
    - Nonce account authority changed to attacker wallet shortly before replay burst.
    - Identical message hash submitted from multiple fee payers racing execution.
  off_chain:
    - Multisig coordinator reports duplicate execution of approved transaction.
    - Nonce account balance drained via withdraw authority abuse.
  account_layout:
    - Nonce account passed as writable without matching expected PDA or vault owner.
    - Fee payer differs from nonce authority in suspicious custodial pattern.
  instruction_discriminators:
    - System Program AdvanceNonceAccount
    - System Program WithdrawFromNonceAccount
reproduction_notes: >
  Create nonce account on local validator with known authority. Construct durable nonce transaction
  with two instructions where second instruction transfers lamports. Partially sign with nonce
  authority, leak serialized transaction bytes. Advance nonce manually, then attempt replay of stale
  bytes on fork where nonce has not yet advanced. Test multisig flow where co-signer approves once
  but attacker rebroadcasts before nonce increment. Verify correct pattern requires AdvanceNonce as
  first instruction and atomic nonce bump. Document failure modes when RPC returns expired blockhash
  for non-nonce transactions versus nonce path.
mitigation:
  - Treat durable nonce transactions as single use; rotate nonce authority after co-signing sessions.
  - Enforce AdvanceNonceAccount as first instruction in wallet validation layer.
  - Monitor nonce account authority changes and large withdraw_from_nonce events.
  - Use height-based expiry metadata off chain for multisig approval workflows.
  - Prefer transaction expiration via blockhash for hot wallet flows when online signing is available.
detection_queries:
  - "duplicate_tx_attempt_same_message_hash AND nonce_account_unchanged"
  - "WithdrawFromNonceAccount WHERE authority_recently_rotated"
related_entries:
  - authority_drain
  - program_upgrade_hijack
