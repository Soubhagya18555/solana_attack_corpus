    value: https://solscan.io/account/M2mx93ekt1fmXSVkTrUL9xVFHkmME8HTUi5Cyc5aF7K
    label: Magic Eden v2 program account
  - type: program_source
    value: https://github.com/metaplex-foundation/mpl-token-metadata
    label: Metaplex token metadata program
tags:
